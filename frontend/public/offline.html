<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetailFlow — Offline</title>
    <style>
      body { font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f9fafb; }
      .card { text-align: center; padding: 2rem; max-width: 400px; }
      h1 { color: #1d4ed8; }
      p { color: #6b7280; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>RetailFlow needs a connection for this page. Stock updates made while offline will sync automatically when you reconnect.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
