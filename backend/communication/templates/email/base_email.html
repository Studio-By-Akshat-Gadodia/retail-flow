<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject|default:title|default:"RetailFlow" }}</title>
  </head>
  <body style="margin:0; padding:0; background:#f8fafc; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:#0f172a; line-height:1.5;">
    <div style="max-width:560px; margin:0 auto; padding:32px 24px;">
      <h1 style="font-size:20px; margin:0 0 16px;">{{ title }}</h1>

      {% if description %}
        <p style="margin:0 0 16px;">{{ description }}</p>
      {% endif %}

      {% if link %}
        <p style="margin:24px 0;">
          <a href="{{ link }}"
             style="display:inline-block; padding:10px 18px; background:#16a34a; color:#fff; text-decoration:none; border-radius:6px;">
            Open
          </a>
        </p>
      {% endif %}

      {% if warning %}
        <p style="color:#b45309; font-size:13px; margin:16px 0 0;">{{ warning }}</p>
      {% endif %}

      <hr style="border:0; border-top:1px solid #e2e8f0; margin:32px 0 16px;">
      <p style="font-size:12px; color:#64748b; margin:0;">RetailFlow</p>
    </div>
  </body>
</html>
